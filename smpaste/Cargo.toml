[package]
name = "smpaste"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Push clipboard images from a client machine to a shell-manager host over SSH"
license = "MIT"

[dependencies]
anyhow = "1.0"
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_System_DataExchange"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSPasteboard"] }
