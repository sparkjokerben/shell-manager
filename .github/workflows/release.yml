name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "shell-manager-$tag-x64"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/sm.exe    dist/
          Copy-Item target/release/smd.exe   dist/
          Copy-Item README.md, README.zh-CN.md, LICENSE, smd-launch.vbs dist/
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shell-manager-*-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
