[package]
name = "shell-manager"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
description = "Persistent Windows shells that survive SSH disconnects (ConPTY + named pipes)"
license = "MIT"
repository = "https://github.com/sparkjokerben/shell-manager"
readme = "README.md"
keywords = ["windows", "conpty", "terminal", "ssh", "persistence"]
categories = ["command-line-utilities"]

[[bin]]
name = "sm"
path = "src/main_sm.rs"

[[bin]]
name = "smd"
path = "src/main_smd.rs"

[[bin]]
name = "smw"
path = "src/main_smw.rs"

[dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_Environment",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
ctrlc = "3.4"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
futures-util = "0.3"
include_dir = "0.7"
