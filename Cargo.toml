[package]
name = "shell-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sd"
path = "src/main_sd.rs"

[[bin]]
name = "shell-daemon"
path = "src/main_daemon.rs"

[dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
ctrlc = "3.4"
